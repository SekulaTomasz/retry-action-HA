[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retry_ha"
version = "1.0.1"
description = "Home Assistant custom integration for executing actions with error handling, retries, and backoff."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Retry HA Contributors" }]
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "ASYNC" # flake8-async
]
